name: NumberOurDays
options:
  bundleIdPrefix: com.numberourdays
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CURRENT_PROJECT_VERSION: "3"
    MARKETING_VERSION: "1.1.0"
targets:
  NumberOurDays:
    type: application
    platform: iOS
    sources:
      - path: NumberOurDays
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.numberourdays.app
        PRODUCT_NAME: NumberOurDays
        INFOPLIST_FILE: NumberOurDays/Info.plist
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/../shared/build/xcode-frameworks"
        SWIFT_OBJC_BRIDGING_HEADER: ""
        ENABLE_BITCODE: false
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    dependencies:
      - framework: ../shared/build/xcode-frameworks/Shared.framework
        embed: true
